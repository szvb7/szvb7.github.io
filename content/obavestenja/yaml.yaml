backend:
  name: github
  repo: vasko-ime/sz-vladislava-bajcevica-7 # ZAMENITE sa vašim GitHub username/repo
  branch: main

media_folder: "slike" # Gde se čuvaju slike otpremljene kroz CMS
public_folder: "/slike" # Kako se putanja do slika prikazuje na sajtu

collections:
  - name: "obavestenja"
    label: "Обавештења"
    folder: "content/obavestenja"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Наслов", name: "title", widget: "string" }
      - { label: "Датум", name: "date", widget: "datetime" }
      - { label: "Текст обавештења", name: "body", widget: "markdown" }